<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="rock-paper-scissors.js"></script>
</head>
<body>
    <header>
        <h1>Rock Paper Scissors!</h1>
    </header>

    <main>
        <section id="game-display">
            <div id="player">
                <h2>Computer</h2>
                <p id="computer-score-display">0</p> 
                <img src="attachments/rock.png" alt="Computer choice">
            </div>

            <p id="game-announcement">Ready to play?</p>

            <div id="player">
                <h2>Human</h2>
                <p id="human-score-display">0</p>
                <img src="attachments/rock.png" alt="Human choice">
            </div>
        </section>


        <section id="game-input">
            <button id="rock"><img src="attachments/rock.png" alt="rock"></button>
            <button id="paper"><img src="attachments/paper.png" alt="paper"></button>
            <button id="scissors"><img src="attachments/scissors.png" alt="scissors"></button>
        </section>
    </main>

    <footer>
        <p>Footer</p>
    </footer>
</body>
</html>
